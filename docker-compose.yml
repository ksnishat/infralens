version: '3.8'

services:
  # ==========================================
  # 1. OLLAMA (LLM Service) - GPU Support
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: infralens_ollama
    # Use bridge network with host access for GPU
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - infralens-network

  # ==========================================
  # 2. BACKEND (FastAPI with YOLO)
  # ==========================================
  backend:
    image: ghcr.io/infralens/api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: infralens_backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - infralens_models:/app/models
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - CONFIDENCE_THRESHOLD=0.25
      - ENABLE_AGENT=true
      - PYTHONUNBUFFERED=1
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # The root path is the health endpoint; /health returns 404.
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - infralens-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==========================================
  # 3. FRONTEND (Streamlit Dashboard)
  # ==========================================
  frontend:
    image: ghcr.io/infralens/api:latest
    container_name: infralens_frontend
    command: streamlit run src/app/ui.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - infralens-network

  # ==========================================
  # 4. MONITORING (Prometheus + Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: infralens_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Retention and WAL compression are CLI-only options, not
      # config-file fields, so they are set here.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.wal-compression'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - infralens-network

  grafana:
    image: grafana/grafana:latest
    container_name: infralens_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=infralens
      # Read by provisioning/datasources/datasources.yml. The compose
      # service is named `prometheus`; run_stack.sh overrides this with
      # the prom_<project> container name it creates instead.
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      # Without this mount Grafana starts with zero dashboards: the
      # provider in dashboards.yml points at /var/lib/grafana/dashboards.
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - infralens-network

  # ==========================================
  # 5. ORCHESTRATION (Airflow)
  # ==========================================
  # Postgres is Airflow's metadata database. It is separate from any
  # application database: Airflow needs its own schema and migrations.
  airflow-postgres:
    image: postgres:15
    container_name: infralens_airflow_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infralens-network

  airflow-webserver:
    image: infralens-airflow:latest
    container_name: infralens_airflow_webserver
    # Run as the host user with GID 0. The Airflow image requires GID 0,
    # and the default uid 50000 cannot write to the host-owned bind
    # mounts — which is why publishing retrained weights to MODEL_PATH
    # failed with Permission denied.
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      # LocalExecutor cannot use SQLite, so Postgres is required.
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # MLflow runs on the host (port 5002), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5002
      - INFRALENS_SRC=/opt/airflow/src
      - INFRALENS_MODEL_DIR=/opt/airflow/models
      - INFRALENS_DATA_YAML=/opt/airflow/dataset/data.yaml
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      # The dataset yaml references ../train/images etc., so the whole
      # dataset directory must be mounted at its original relative location.
      - ./Rust Detection.v1i.yolov8:/opt/airflow/dataset
      # Named volume, not a bind mount: a host ./logs directory owned by root is
      # not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
      # Training exports the retrained weights here. ./src is a read-only bind
      # mount, so the exports need their own writable volume.
      - airflow_models:/opt/airflow/models
    ports:
      - "8082:8080"
    command: webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - infralens-network

  airflow-scheduler:
    image: infralens-airflow:latest
    container_name: infralens_airflow_scheduler
    # Run as the host user with GID 0. The Airflow image requires GID 0,
    # and the default uid 50000 cannot write to the host-owned bind
    # mounts — which is why publishing retrained weights to MODEL_PATH
    # failed with Permission denied.
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5002
      - INFRALENS_SRC=/opt/airflow/src
      - INFRALENS_MODEL_DIR=/opt/airflow/models
      - INFRALENS_DATA_YAML=/opt/airflow/dataset/data.yaml
      # The retraining DAG calls /admin/reload-model and /monitoring, both of
      # which enforce X-API-Key. Without this the DAG got a 401 and failed.
      # Must match the API_KEY the serving API was started with.
      - API_KEY=${API_KEY:-demo-secret-key}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      # The dataset yaml references ../train/images etc., so the whole
      # dataset directory must be mounted at its original relative location.
      - ./Rust Detection.v1i.yolov8:/opt/airflow/dataset
      - airflow_logs:/opt/airflow/logs
      - airflow_models:/opt/airflow/models
    command: scheduler
    depends_on:
      - airflow-webserver
    networks:
      - infralens-network

networks:
  infralens-network:
    driver: bridge

volumes:
  ollama_data:
  infralens_models:
  prometheus_data:
  grafana_data:
  airflow_postgres_data:
  airflow_logs:
  airflow_models: