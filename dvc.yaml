# DVC Pipeline for InfraLens
# Bronze -> Train
#
# Every stage below references a script that exists in this repository and
# declares only outputs the script actually produces. Run the whole pipeline
# with `dvc repro`, or a single stage with `dvc repro <stage>`.
#
# The raw dataset is not committed. Fetch it first (see the README) and place
# it at data/raw, or pass a different --source.

stages:
  # === BRONZE LAYER: Raw data ingestion ===
  extract_bronze:
    cmd: python src/scripts/extract_bronze.py --source data/raw --output data/bronze
    deps:
      - src/scripts/extract_bronze.py
    outs:
      - data/bronze
    desc: Collect raw inspection images (bronze layer)

  # === MODEL TRAINING ===
  # The previous version of this file declared preprocess_silver and label_gold
  # stages pointing at src/scripts/preprocess_silver.py and label_gold.py.
  # Neither file has ever existed in this repository, so `dvc repro` failed
  # immediately. The dataset ships pre-split by Roboflow, so there is no
  # separate preprocessing or labelling step to run.
  train_yolo:
    cmd: python src/scripts/train_yolo.py --epochs ${training.epochs} --batch-size ${training.batch_size}
    deps:
      - src/scripts/train_yolo.py
      - "Rust Detection.v1i.yolov8/data.yaml"
    params:
      - training.epochs
      - training.batch_size
    outs:
      - runs/detect
    desc: Train YOLOv8 model for rust detection
