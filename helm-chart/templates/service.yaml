apiVersion: v1
kind: Service
metadata:
  name: {{ include "infralens.fullname" . }}-backend-service
  labels:
    app: {{ include "infralens.fullname" . }}
    component: backend
spec:
  selector:
    app: {{ include "infralens.fullname" . }}
    component: backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: {{ .Values.service.type }}
