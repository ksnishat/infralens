replicaCount: 2

image:
  repository: ghcr.io/ksnishat/infralens
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: infralens.example.com
  tls: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi
    # The YOLO model runs on CPU in the serve image. Set this to 1 only on a
    # cluster with an NVIDIA device plugin; otherwise the pod stays Pending
    # with "Insufficient nvidia.com/gpu".
    nvidia.com/gpu: 0

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

env:
  APP_NAME: infralens
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  CONFIDENCE_THRESHOLD: "0.25"
  ENABLE_AGENT: "true"
  OLLAMA_HOST: http://ollama-service:11434
  OLLAMA_MODEL: llama3

# The serve image bakes the trained weights into /app/models. Mounting an
# empty PVC over that path hides them and the API starts with no model, so
# persistence is off by default. Enable it only when you supply weights
# through the volume instead of the image.
persistence:
  enabled: false
  size: 5Gi
  accessMode: ReadWriteOnce

streamlit:
  enabled: true
  port: 8501
  replicas: 1
