# DVC Parameters for InfraLens
preprocessing:
  image_size: [640, 640]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.1
    rotation: 15
    brightness: 0.2
    contrast: 0.2

model:
  architecture: yolov8s
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0005
  mosaic_augmentation: true

gold:
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  classes:
    0: crack
    1: rust
    2: corrosion
    3: dent
    4: contamination